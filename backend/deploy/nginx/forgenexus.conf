# ===========================================
# ForgeNexus — Production Nginx Configuration
# ===========================================
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled
# Requires: certbot for SSL, nginx-brotli module (optional)
#
# Setup:
#   1. sudo apt install nginx certbot python3-certbot-nginx
#   2. sudo cp this_file /etc/nginx/sites-available/forgenexus
#   3. sudo ln -s /etc/nginx/sites-available/forgenexus /etc/nginx/sites-enabled/
#   4. Update server_name to your domain
#   5. sudo certbot --nginx -d yourdomain.com
#   6. sudo nginx -t && sudo systemctl reload nginx

# ===========================================
# Cloudflare Real IP Restoration
# ===========================================
# Uncomment if using Cloudflare (recommended)
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
# set_real_ip_from 2400:cb00::/32;
# set_real_ip_from 2606:4700::/32;
# set_real_ip_from 2803:f800::/32;
# set_real_ip_from 2405:b500::/32;
# set_real_ip_from 2405:8100::/32;
# set_real_ip_from 2a06:98c0::/29;
# set_real_ip_from 2c0f:f248::/32;
# real_ip_header CF-Connecting-IP;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=uploads:10m rate=10r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Cache zone for microcaching public endpoints
proxy_cache_path /var/cache/nginx/forgenexus levels=1:2 keys_zone=fn_cache:10m max_size=100m inactive=5m;

# Upstream backends
upstream phoenix {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream sveltekit {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com;

    # --- SSL (managed by certbot) ---
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;

    # Modern SSL config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Brotli (if nginx-brotli module is installed)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml;

    # --- Connection limits ---
    limit_conn addr 50;

    # --- Client limits ---
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # --- Proxy defaults ---
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;

    # ===========================================
    # API Routes → Phoenix
    # ===========================================

    # Health check (no rate limit, no cache)
    location = /api/health {
        proxy_pass http://phoenix;
    }

    # Auth endpoints (strict rate limit)
    location ~ ^/api/auth/(register|login|forgot-password|reset-password) {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://phoenix;
    }

    # Upload endpoints (rate limited)
    location ~ ^/api/(uploads|setup/upload-logo) {
        limit_req zone=uploads burst=5 nodelay;
        client_max_body_size 10m;
        proxy_pass http://phoenix;
    }

    # Public read endpoints (microcached)
    location ~ ^/api/(settings/public|forums$|stats) {
        proxy_cache fn_cache;
        proxy_cache_valid 200 5s;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://phoenix;
    }

    # All other API routes
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://phoenix;
    }

    # ===========================================
    # WebSocket → Phoenix
    # ===========================================

    location /socket/ {
        proxy_pass http://phoenix;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }

    location /live/ {
        proxy_pass http://phoenix;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }

    # ===========================================
    # Static uploads → serve directly from disk
    # ===========================================

    location /uploads/ {
        alias /home/forge_nexus/app/priv/static/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===========================================
    # Frontend → SvelteKit
    # ===========================================

    # SvelteKit static assets (long cache)
    location /_app/ {
        proxy_pass http://sveltekit;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Everything else → SvelteKit
    location / {
        proxy_pass http://sveltekit;
    }
}
