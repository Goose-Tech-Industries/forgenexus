# ===========================================
# ForgeNexus — PostgreSQL 16 Tuning
# Optimized for: 4 vCPU, 8GB RAM (shared with app)
# ===========================================
# PostgreSQL gets ~4GB of the 8GB total

# --- Connection ---
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# --- Memory ---
# ~25% of total RAM available to PostgreSQL
shared_buffers = 1GB
# Per-operation memory (sorts, joins, hashes)
work_mem = 32MB
# Planner estimate of OS cache available
effective_cache_size = 3GB
# Maintenance operations (VACUUM, CREATE INDEX)
maintenance_work_mem = 256MB

# --- WAL / Write Performance ---
wal_buffers = 32MB
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# --- Query Planning ---
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- Parallel Queries (4 vCPU) ---
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# --- Logging ---
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# --- Timeouts ---
statement_timeout = 60000
idle_in_transaction_session_timeout = 300000

# --- Autovacuum ---
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60

# --- Locale ---
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
