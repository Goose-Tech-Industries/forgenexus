# coturn — ForgeNexus voice room TURN/STUN
# Long-term-credential mechanism with HMAC time-limited usernames (RFC 7635 / 8489)

listening-port=3478
tls-listening-port=5349
external-ip=CHANGE_ME_your_server_public_ip

# REST-API HMAC credentials minted by Phoenix
use-auth-secret
static-auth-secret=CHANGE_ME_generate_a_new_random_secret
realm=CHANGE_ME_your_domain

# UDP relay range (open these on host firewall)
min-port=49152
max-port=49652

# Production hardening
fingerprint
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
syslog
log-file=/var/log/coturn/turn.log
verbose
