services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forge_nexus
      POSTGRES_PASSWORD: forge_nexus_dev
      POSTGRES_DB: forge_nexus_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional: enables fast full-text search. Without it, ForgeNexus falls back to PostgreSQL pg_trgm.
  meilisearch:
    image: getmeili/meilisearch:v1.11
    profiles: ["search"]
    environment:
      MEILI_MASTER_KEY: forge_nexus_dev_key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

volumes:
  pgdata:
  meilidata:

networks:
  default:
    ipam:
      config:
        - subnet: 10.99.0.0/16
